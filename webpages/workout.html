<!DOCTYPE html>
<html>
<head>
    <title>Workout - WORKOUTPLANNER</title>
    <link href="../styling/universal.css" rel="stylesheet">
    <link href="../styling/cursor.css" rel="stylesheet">
    <script src="../js/cursor.js"></script>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Replace the old <script type="text/babel"> config with this -->
    <script type="text/babel">
        // We will render the app directly here once the file is loaded
        window.addEventListener('load', () => {
            const root = ReactDOM.createRoot(document.getElementById('workout-root'));
            root.render(<WorkoutPlanner />);
        });
    </script>
</head>
<body>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>
    
    <!-- Navbar remains standard HTML -->
    <section id="navbar">
        <a href="about.html">ABOUT</a>
        <a href="workout.html">WORKOUT</a>
        <div id="logo"><a href="../index.html">W<span>P</span></a></div>
        <a href="metrics.html">METRICS</a>
        <a href="contact.html">CONTACT</a>    
    </section>

    <!-- React will inject the planner here -->
    <div id="workout-root"></div>

    <!-- Load your JSX file as a "babel" script -->
    <script type="text/babel" data-presets="react" src="workout.jsx"></script>

    <!-- The Connector -->
    <script type="text/babel">
        function renderApp() {
            if (typeof WorkoutPlanner !== 'undefined') {
                const container = document.getElementById('workout-root');
                const root = ReactDOM.createRoot(container);
                root.render(<WorkoutPlanner />);
            } else {
                // If the file isn't ready, try again in 50ms
                setTimeout(renderApp, 50);
            }
        }
        renderApp();
    </script>
</body>
</html>
